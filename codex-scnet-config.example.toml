# Merge these entries into ~/.codex/config.toml.
# Keep the API key out of this file. Set it in the environment instead:
# export SCNET_TOKEN_PLAN_API_KEY='your-new-sk-tp-key'

model = "DeepSeek-V4-Flash-0731"
